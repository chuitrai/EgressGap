[project]
name = "teep"
version = "0.1.0"
description = "Measuring residual egress capacity in hostname-based CI/CD allowlists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "checkov>=3.1.47",
    "dnspython>=2.8.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "npm>=0.1.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teep"]          # includes src/teep/config/*.json|yaml|dat

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
